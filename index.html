<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030305">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CHROMA">
  <meta name="application-name" content="CHROMA">
  <meta name="description" content="Keep the Chroma flowing. Keep the city alive.">
  <title>Chroma</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="city" aria-hidden="true"></canvas>
  <main>
    <div class="stage">
      <canvas id="game"></canvas>
      <div id="overlay" class="overlay"><div id="panel" class="panel"></div></div>
    </div>
    <div class="controls">
      <button id="btn-flood">Flood now [F]</button>
      <button id="btn-pause">Pause [P]</button>
      <button id="btn-sound">Sound on [M]</button>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
