# Static site: no build step, publish the project root.
[build]
  publish = "."

# The service worker must always be re-checked so phones pick up new versions.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
